input {
  # Logs from all microservices
  http {
    port => 5044
    codec => json
  }
  
  # File input for local development
  file {
    path => "/var/log/microservices/*.log"
    start_position => "beginning"
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] {
    json {
      source => "message"
    }
  }

  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }

  # Add service name if not present
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  # Parse log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch-logs:9200"]
    index => "car-rental-logs-%{+YYYY.MM.dd}"
  }
  
  # For debugging
  stdout {
    codec => rubydebug
  }
}

