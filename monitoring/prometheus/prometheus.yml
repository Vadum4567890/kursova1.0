global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'car-rental-local'
    environment: 'development'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # User Service
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3002']
        labels:
          service: 'user-service'

  # Car Service
  - job_name: 'car-service'
    static_configs:
      - targets: ['car-service:3003']
        labels:
          service: 'car-service'

  # Rental Service
  - job_name: 'rental-service'
    static_configs:
      - targets: ['rental-service:3003']
        labels:
          service: 'rental-service'

  # Payment Service
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3004']
        labels:
          service: 'payment-service'

  # Analytics Service
  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:3005']
        labels:
          service: 'analytics-service'

  # Chat Service
  - job_name: 'chat-service'
    static_configs:
      - targets: ['chat-service:3006']
        labels:
          service: 'chat-service'

  # Notification Service
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3007']
        labels:
          service: 'notification-service'

  # Review Service
  - job_name: 'review-service'
    static_configs:
      - targets: ['review-service:3008']
        labels:
          service: 'review-service'

  # Report Service
  - job_name: 'report-service'
    static_configs:
      - targets: ['report-service:3009']
        labels:
          service: 'report-service'

  # Support Service
  - job_name: 'support-service'
    static_configs:
      - targets: ['support-service:3011']
        labels:
          service: 'support-service'

