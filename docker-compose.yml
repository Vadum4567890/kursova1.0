services:
  # PostgreSQL - основна база даних
  postgres:
    image: postgres:15-alpine
    container_name: car-rental-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/init/02-init-car-service-db.sql:/docker-entrypoint-initdb.d/02-init-car-service-db.sql
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  # (Optional) Add redis/kafka/etc later if needed.

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: car-rental-user-service
    environment:
      PORT: 3002
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_DATABASE: user_service_db
      JWT_SECRET: dev-user-service-secret
      JWT_EXPIRES_IN: 24h
    ports:
      - "3002:3002"
    depends_on:
      - postgres
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Car Service
  car-service:
    build:
      context: ./services/car-service
      dockerfile: Dockerfile
    container_name: car-rental-car-service
    environment:
      PORT: 3003
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_DATABASE: car_service_db
      USER_SERVICE_URL: http://user-service:3002
      SERVICE_API_KEY: internal-service-key
      JWT_SECRET: dev-user-service-secret
      JWT_EXPIRES_IN: 24h
    ports:
      - "3003:3003"
    depends_on:
      - postgres
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rental Service
  rental-service:
    build:
      context: ./services/rental-service
      dockerfile: Dockerfile
    container_name: car-rental-rental-service
    environment:
      PORT: 3004
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_DATABASE: rental_service_db
      CAR_SERVICE_URL: http://car-service:3003
      USER_SERVICE_URL: http://user-service:3002
      SERVICE_API_KEY: internal-service-key
    ports:
      - "3004:3004"
    depends_on:
      - postgres
    networks:
      - car-rental-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  # add more volumes later if needed

networks:
  car-rental-network:
    driver: bridge

